format:
  html:
    theme:
      light: [assets/css/light.scss, assets/css/common.scss]
      dark:  [assets/css/dark.scss,  assets/css/common.scss]
    respect-user-color-scheme: true
    include-in-header: _includes/head.html
    include-after-body: _includes/after-body.html
    grid:
      body-width: 760px
      sidebar-width: 260px
      margin-width: 260px
      gutter-width: 2.5rem
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "On this page"
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    footnotes-hover: true
    citations-hover: true
    html-math-method: katex
    code-copy: true
    code-overflow: scroll
    code-line-numbers: false
    code-block-bg: true
    highlight-style:
      light: github
      dark: github-dark
    fig-align: center
    fig-responsive: true
    lightbox: true
    title-block-banner: false

language:
  listing-page-no-matches: "New articles are on the way. Check back soon."
  search-no-results-text: "Nothing found. Try another term."

execute:
  freeze: auto
  echo: true
  warning: false
